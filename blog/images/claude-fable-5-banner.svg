<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a1a"/>
      <stop offset="100%" style="stop-color:#1a1035"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d5aff"/>
      <stop offset="100%" style="stop-color:#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" style="stop-color:rgba(109,90,255,0.15)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="40%" r="35%">
      <stop offset="0%" style="stop-color:rgba(167,139,250,0.1)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Grid pattern -->
  <g opacity="0.05" stroke="#6d5aff" stroke-width="0.5">
    <line x1="0" y1="0" x2="1200" y2="630"/>
    <line x1="1200" y1="0" x2="0" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="200" cy="150" r="80" fill="none" stroke="#6d5aff" stroke-width="1" opacity="0.15"/>
  <circle cx="200" cy="150" r="120" fill="none" stroke="#6d5aff" stroke-width="0.5" opacity="0.08"/>
  <circle cx="1000" cy="480" r="100" fill="none" stroke="#a78bfa" stroke-width="1" opacity="0.12"/>
  <circle cx="1000" cy="480" r="140" fill="none" stroke="#a78bfa" stroke-width="0.5" opacity="0.06"/>

  <!-- Neural network nodes -->
  <g opacity="0.25">
    <circle cx="900" cy="100" r="4" fill="#6d5aff"/>
    <circle cx="950" cy="140" r="3" fill="#a78bfa"/>
    <circle cx="870" cy="180" r="3" fill="#6d5aff"/>
    <circle cx="1020" cy="120" r="2" fill="#a78bfa"/>
    <circle cx="980" cy="200" r="3" fill="#6d5aff"/>
    <circle cx="1050" cy="170" r="2" fill="#a78bfa"/>
    <line x1="900" y1="100" x2="950" y2="140" stroke="#6d5aff" stroke-width="0.5"/>
    <line x1="950" y1="140" x2="870" y2="180" stroke="#6d5aff" stroke-width="0.5"/>
    <line x1="900" y1="100" x2="1020" y2="120" stroke="#a78bfa" stroke-width="0.5"/>
    <line x1="950" y1="140" x2="980" y2="200" stroke="#6d5aff" stroke-width="0.5"/>
    <line x1="1020" y1="120" x2="1050" y2="170" stroke="#a78bfa" stroke-width="0.5"/>
  </g>

  <!-- Main title -->
  <text x="600" y="200" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="72" fill="#ffffff">
    Claude Fable 5
  </text>

  <!-- Subtitle -->
  <text x="600" y="265" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="400" font-size="28" fill="#a78bfa">
    Anthropic's Most Powerful AI — Explained
  </text>

  <!-- Divider line -->
  <rect x="450" y="300" width="300" height="2" rx="1" fill="url(#accent)" opacity="0.6"/>

  <!-- Key stats -->
  <g font-family="Inter, system-ui, sans-serif" text-anchor="middle">
    <!-- Stat 1 -->
    <text x="300" y="380" font-weight="800" font-size="36" fill="#ffffff">50M</text>
    <text x="300" y="410" font-weight="400" font-size="14" fill="#94a3b8">Lines of code migrated</text>
    <text x="300" y="430" font-weight="400" font-size="14" fill="#94a3b8">in a single day</text>

    <!-- Stat 2 -->
    <text x="600" y="380" font-weight="800" font-size="36" fill="#ffffff">#1</text>
    <text x="600" y="410" font-weight="400" font-size="14" fill="#94a3b8">On all frontier</text>
    <text x="600" y="430" font-weight="400" font-size="14" fill="#94a3b8">benchmarks</text>

    <!-- Stat 3 -->
    <text x="900" y="380" font-weight="800" font-size="36" fill="#ffffff">$10</text>
    <text x="900" y="410" font-weight="400" font-size="14" fill="#94a3b8">Per million input</text>
    <text x="900" y="430" font-weight="400" font-size="14" fill="#94a3b8">tokens</text>
  </g>

  <!-- Tags -->
  <g font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="310" y="490" width="130" height="32" rx="16" fill="rgba(109,90,255,0.15)" stroke="rgba(109,90,255,0.3)" stroke-width="1"/>
    <text x="375" y="511" text-anchor="middle" fill="#a78bfa">Software Eng</text>

    <rect x="460" y="490" width="130" height="32" rx="16" fill="rgba(52,211,153,0.1)" stroke="rgba(52,211,153,0.3)" stroke-width="1"/>
    <text x="525" y="511" text-anchor="middle" fill="#34d399">Vision AI</text>

    <rect x="610" y="490" width="150" height="32" rx="16" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="685" y="511" text-anchor="middle" fill="#f59e0b">Knowledge Work</text>

    <rect x="780" y="490" width="130" height="32" rx="16" fill="rgba(59,130,246,0.1)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
    <text x="845" y="511" text-anchor="middle" fill="#60a5fa">Autonomous</text>
  </g>

  <!-- Bytesync branding -->
  <text x="600" y="590" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="14" fill="#64748b">
    bytesync.in — June 2026
  </text>
</svg>
