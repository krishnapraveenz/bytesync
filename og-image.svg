<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27"/>
      <stop offset="100%" style="stop-color:#1a1040"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea"/>
      <stop offset="100%" style="stop-color:#764ba2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(102,126,234,0.15)"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <!-- Decorative grid -->
  <g opacity="0.04" stroke="#667eea">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>
  <!-- Left accent bar -->
  <rect x="80" y="180" width="4" height="270" rx="2" fill="url(#accent)"/>
  <!-- Company name -->
  <text x="110" y="230" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="64" fill="#ffffff">Bytesync</text>
  <text x="110" y="290" font-family="Inter,system-ui,sans-serif" font-weight="400" font-size="28" fill="#94a3b8">Technologies &amp; Communications</text>
  <!-- Tagline -->
  <text x="110" y="350" font-family="Inter,system-ui,sans-serif" font-weight="500" font-size="22" fill="#667eea">Transforming Ideas into Digital Reality</text>
  <!-- Divider -->
  <rect x="110" y="380" width="200" height="2" rx="1" fill="url(#accent)" opacity="0.5"/>
  <!-- Services -->
  <g font-family="Inter,system-ui,sans-serif" font-size="18" fill="#64748b">
    <text x="110" y="420">Web Development</text>
    <text x="310" y="420">Mobile Apps</text>
    <text x="460" y="420">Digital Marketing</text>
    <text x="660" y="420">Cisco Solutions</text>
    <text x="830" y="420">Cloud Services</text>
    <text x="1010" y="420">UI/UX Design</text>
  </g>
  <!-- Location badge -->
  <rect x="110" y="460" width="260" height="36" rx="18" fill="rgba(102,126,234,0.1)" stroke="rgba(102,126,234,0.2)" stroke-width="1"/>
  <text x="240" y="484" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="500" font-size="14" fill="#a78bfa">📍 Palakkad, Kerala, India</text>
  <!-- URL -->
  <text x="110" y="540" font-family="Inter,system-ui,sans-serif" font-weight="600" font-size="20" fill="#475569">bytesync.in</text>
  <!-- Right side decorative circles -->
  <circle cx="1050" cy="200" r="60" fill="none" stroke="#667eea" stroke-width="1" opacity="0.1"/>
  <circle cx="1050" cy="200" r="90" fill="none" stroke="#667eea" stroke-width="0.5" opacity="0.06"/>
  <circle cx="980" cy="420" r="40" fill="none" stroke="#764ba2" stroke-width="1" opacity="0.1"/>
</svg>
